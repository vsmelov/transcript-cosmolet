# Общие настройки всех воркеров: образ один, различаются они только ролью.
x-worker: &worker
  build: ./worker
  restart: unless-stopped
  env_file: .env
  volumes:
    - ./data:/data
    - ./models:/models:ro
    # токены Plaud: создаются на хосте командой `plaud login`, обновляются по refresh
    - ${USERPROFILE:-~}/.plaud:/plaud
  depends_on:
    db:
      condition: service_healthy

x-worker-env: &worker-env
  DATABASE_URL: postgresql://cosmolet:${POSTGRES_PASSWORD}@db:5432/cosmolet
  DATA_DIR: /data
  EMBED_MODEL: /models/campplus_zh_en_advanced.onnx
  PLAUD_TOKENS: /plaud/tokens.json
  # Размеры пулов — в одном месте: воркер по ним запускает потоки, UI по ним
  # показывает загрузку. Разъедутся — интерфейс будет врать про «6 из 4».
  DOWNLOAD_WORKERS: ${DOWNLOAD_WORKERS:-6}
  DETECT_WORKERS: ${DETECT_WORKERS:-5}
  QUALITY_WORKERS: ${QUALITY_WORKERS:-6}
  RESOLVE_WORKERS: ${RESOLVE_WORKERS:-5}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cosmolet
      POSTGRES_USER: cosmolet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmolet"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Этапы разнесены по контейнерам НАМЕРЕННО. Пока они жили в одном сервисе, правка
  # кода опознания перезапускала заодно детектор и транскрипцию: их этапы обрывались
  # на полуслове и помечались «прервано рестартом воркера», теряя десятки минут
  # счёта. Теперь пересобирается только тот контейнер, чей код изменился.
  # stop_grace_period даёт начатому этапу доработать: по сигналу воркер перестаёт
  # брать новую работу и доводит текущую до конца.
  worker-download:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ROLE: download
    stop_grace_period: 120s

  worker-detect:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ROLE: detect
    stop_grace_period: 900s

  worker-quality:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ROLE: quality
    stop_grace_period: 900s

  worker-resolve:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ROLE: resolve
    stop_grace_period: 900s

  ui:
    build: ./ui
    restart: unless-stopped
    env_file: .env          # ключи провайдеров: UI показывает остатки на счетах
    environment:
      DATABASE_URL: postgresql://cosmolet:${POSTGRES_PASSWORD}@db:5432/cosmolet
      DATA_DIR: /data
      EMBED_MODEL: /models/campplus_zh_en_advanced.onnx
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD}   # тот же предохранитель, что у воркера
      DOWNLOAD_WORKERS: ${DOWNLOAD_WORKERS:-6}
      DETECT_WORKERS: ${DETECT_WORKERS:-5}
      QUALITY_WORKERS: ${QUALITY_WORKERS:-6}
      RESOLVE_WORKERS: ${RESOLVE_WORKERS:-5}
    volumes:
      - ./data:/data
      - ./models:/models:ro
    ports:
      - "127.0.0.1:8090:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
