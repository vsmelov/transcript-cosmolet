services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cosmolet
      POSTGRES_USER: cosmolet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmolet"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: ./worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cosmolet:${POSTGRES_PASSWORD}@db:5432/cosmolet
      DATA_DIR: /data
      EMBED_MODEL: /models/campplus_zh_en_advanced.onnx
    volumes:
      - ./data:/data
      - ./models:/models:ro
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: ./ui
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cosmolet:${POSTGRES_PASSWORD}@db:5432/cosmolet
      DATA_DIR: /data
      EMBED_MODEL: /models/campplus_zh_en_advanced.onnx
    volumes:
      - ./data:/data
      - ./models:/models:ro
    ports:
      - "127.0.0.1:8090:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
