<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cosmolet</title>
<style>
:root{--bg:#0f1115;--panel:#161a22;--panel2:#1c2130;--border:#252b3b;--text:#e6e6e6;--dim:#8891a7;--acc:#7aa2f7;--red:#f7768e;--green:#9ece6a;--yellow:#e0af68;--hl:#1b2540}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
/* шапка двухуровневая: строка навигации + строка глобального плеера.
   sticky целиком, поэтому плеер виден на любой вкладке и не прыгает при переключении */
header{border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
.hrow{display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap}
.hrow.pl{gap:10px;border-top:1px solid var(--border)}
h1{font-size:16px;margin:0;color:var(--acc)}
h3{margin:20px 0 8px;font-size:14px;color:var(--dim);font-weight:600}
nav{display:flex;gap:4px}
nav button{background:none;border:1px solid transparent;color:var(--dim);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{color:var(--text);background:var(--panel);border-color:var(--border)}
#err{color:var(--red);font-size:12px;margin-left:auto}
#costBadge{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer}
#costBadge:hover{border-color:var(--acc)}
main{padding:16px;max-width:1200px;margin:0 auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--dim);font-weight:500;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--border)}
td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
tr[data-act]{cursor:pointer}
tr[data-act]:hover td{background:var(--panel)}
.st{display:inline-block;padding:1px 8px;border-radius:9px;font-size:12px;border:1px solid var(--border)}
.st-new{color:var(--acc)}.st-processing,.st-running{color:var(--yellow)}.st-done{color:var(--green)}.st-failed{color:var(--red)}.st-pending,.st-skipped{color:var(--dim)}
.st-download{color:var(--yellow);border-color:var(--yellow)}
.badge.src{color:var(--dim);text-transform:lowercase}
.badge.src-plaud{color:var(--acc);border-color:var(--acc)}
button.act{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:3px 10px;cursor:pointer;font:inherit;font-size:12px}
button.act:hover{border-color:var(--acc)}
button.act.playing{border-color:var(--acc);background:rgba(122,162,247,.18);color:var(--acc)}
button.act:disabled,button.act[disabled]{opacity:.4;cursor:not-allowed;border-color:var(--border)}
button.lnk{background:none;border:none;color:var(--dim);cursor:pointer;font:inherit;font-size:12px;padding:0 4px;flex:none}
button.lnk:hover{color:var(--acc)}
button.lnk.ok{color:var(--green)}
input{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:3px 8px;font:inherit;font-size:12px;width:130px}
select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font:inherit;max-width:100%}
/* единственный <audio> на страницу — он же в шапке */
#player{flex:none;width:320px;height:34px;margin:0;display:block}
#pnow{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;font-size:12px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pnow b{overflow:hidden;text-overflow:ellipsis}
#pstop{flex:none}
.pico{flex:none;color:var(--acc)}
a{color:var(--acc)}
.dim{color:var(--dim)}
.errtxt{color:var(--red)}
.mono{font-variant-numeric:tabular-nums}
.sub{font-size:11px;color:var(--dim)}
.cards{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 16px;min-width:130px}
.card .v{font-size:20px;color:var(--acc);font-variant-numeric:tabular-nums}
.pipe{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:6px 0}
.stage{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;min-width:170px;font-size:12px}
.arr{align-self:center;color:var(--dim)}
.seg{padding:5px 10px;border:1px solid transparent;border-radius:6px;cursor:pointer;display:flex;gap:10px;align-items:baseline;transition:background .4s,box-shadow .4s,border-color .4s}
.seg:hover{background:var(--panel)}
.seg.amb{border-color:var(--red)}
.seg .t,.frag .t{color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
.frag{display:flex;gap:10px;align-items:baseline;padding:3px 0}
.frag.amb{opacity:.62;border-left:2px solid var(--red);padding-left:6px}
.spk{font-weight:600;flex:none}
.badge{font-size:11px;border:1px solid var(--border);border-radius:8px;padding:0 6px;color:var(--dim);flex:none;white-space:nowrap}
.badge.bad{color:var(--red);border-color:var(--red)}
.txt{flex:1;min-width:0}
.pan{margin:2px 0 10px 78px;padding:10px;background:var(--panel);border:1px solid var(--border);border-radius:6px;font-size:13px}
.rsrow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:8px}
.cand span{margin-right:12px}
.hl{border-color:var(--acc)!important;background:var(--hl)!important;box-shadow:0 0 0 2px var(--acc)}
.card.hl,.seg.hl{transition:background .4s,box-shadow .4s,border-color .4s}
tr.hl td{background:var(--hl);box-shadow:inset 0 1px 0 var(--acc),inset 0 -1px 0 var(--acc)}
.subnav{display:flex;gap:4px;align-items:center;margin-bottom:6px}
.subnav button{background:none;border:1px solid transparent;color:var(--dim);padding:4px 10px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
.subnav button.on{color:var(--text);background:var(--panel);border-color:var(--border)}
.pitem{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.pitem:hover,.pitem.on{border-color:var(--acc)}
.off{opacity:.45}
/* список записей на вкладке «Транскрипт» */
.rec{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.rec:hover{border-color:var(--acc)}
.rec .main{min-width:0;flex:1}
.rec .meta{flex:none;text-align:right}
.rtitle{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.rdate{font-size:15px;color:var(--text)}
.spks{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.spkb{color:var(--dim)}
.trhead{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:8px 0}
/* Usage */
.bar{height:7px;background:var(--panel2);border:1px solid var(--border);border-radius:5px;margin:8px 0 4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green)}
.card.wide{width:100%}
svg text{font-family:inherit}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>cosmolet</h1>
    <nav>
      <button data-tab="jobs" class="on">Jobs</button>
      <button data-tab="tr">Транскрипт</button>
      <button data-tab="voices">Голоса</button>
      <button data-tab="disk">Диск</button>
      <button data-tab="sp">Спикеры</button>
      <button data-tab="usage">Usage</button>
    </nav>
    <span id="err"></span>
    <span id="costBadge" data-act="goto" data-h="usage" title="куда уходят деньги →">…</span>
  </div>
  <div class="hrow pl">
    <audio id="player" controls preload="metadata"></audio>
    <div id="pnow"><span class="dim">ничего не играет</span></div>
    <button class="act" id="pstop" data-act="pstop" disabled>■ стоп</button>
  </div>
</header>
<main>
  <section id="tab-jobs" class="tab">
    <table>
      <thead><tr><th>ID</th><th>Запись</th><th>Источник</th><th>Статус</th><th>Длит.</th><th>Размер</th><th>Сегм.</th><th>Конфл.</th><th>Стоимость</th><th>Создана</th><th></th></tr></thead>
      <tbody id="jobsBody"><tr><td colspan="11" class="dim">загрузка…</td></tr></tbody>
    </table>
  </section>

  <section id="tab-tr" class="tab" style="display:none">
    <div id="trList"><div class="dim">загрузка…</div></div>
    <div id="trWrap" style="display:none">
      <div class="rsrow" style="margin-top:0">
        <button class="act" data-act="goto" data-h="transcript">← к списку</button>
      </div>
      <div id="trHead"></div>
      <div id="playHint" style="display:none;margin:6px 0">
        <button class="act" data-act="playat">▶ играть с <span id="playHintT"></span></button>
        <span class="dim" style="font-size:12px;margin-left:6px">браузер не даёт стартовать звук без клика</span>
      </div>
      <div id="segList"></div>
    </div>
  </section>

  <section id="tab-voices" class="tab" style="display:none">
    <div class="subnav" id="vnav">
      <button data-vsec="people" class="on">Люди</button>
      <button data-vsec="enroll">Разметка записи</button>
      <button data-vsec="sugg">Предложения</button>
    </div>
    <div id="vsec-people" class="vsec" style="display:flex;gap:16px;align-items:flex-start">
      <div id="peopleList" style="flex:0 0 250px"><div class="dim">загрузка…</div></div>
      <div id="personCard" style="flex:1;min-width:0"><div class="dim">выберите человека слева</div></div>
    </div>
    <div id="vsec-enroll" class="vsec" style="display:none">
      <div class="rsrow" style="margin-top:0">
        <select id="enrollSel"></select>
        <button class="act" data-act="ereload">пересчитать</button>
        <span id="enrollHint" class="dim" style="font-size:12px"></span>
      </div>
      <div id="enrollBody"><div class="dim">выберите запись</div></div>
    </div>
    <div id="vsec-sugg" class="vsec" style="display:none">
      <div id="suggBody"><div class="dim">загрузка…</div></div>
    </div>
  </section>

  <section id="tab-disk" class="tab" style="display:none">
    <div class="cards" id="diskCards"><div class="dim">загрузка…</div></div>
    <h3>Топ-15 файлов</h3>
    <table>
      <thead><tr><th style="width:90px">МБ</th><th>Путь</th></tr></thead>
      <tbody id="diskTop"></tbody>
    </table>
  </section>

  <section id="tab-sp" class="tab" style="display:none">
    <div class="cards" id="spkList"><div class="dim">загрузка…</div></div>
    <h3 id="confHead">Конфликты</h3>
    <div id="confNote" class="dim" style="font-size:12px"></div>
    <div class="cards" id="confList"></div>
  </section>

  <section id="tab-usage" class="tab" style="display:none">
    <div id="usageBody"><div class="dim">загрузка…</div></div>
  </section>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);
let TAB = 'jobs', RECS = [], SEGS = [], SPK = [], CONF_BY_SEG = {}, OPEN = null, CUR_RID = null, PEND_T = null;
let VSEC = 'people', VPEOPLE = [], VPERSON = null, ERID = null, ECAND = null;
let RSUM = null;      // /api/recordings/summary — список записей со спикерами
let TR_AUDIO = true;  // у открытой в «Транскрипте» записи есть аудиофайл

// ---------- утилиты ----------
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT = s => { s = Math.max(0, Math.floor(+s || 0)); return [s/3600|0, (s/60|0)%60, s%60].map(n => String(n).padStart(2,'0')).join(':'); };
// мелкие суммы — 4 знака (иначе всё выглядит как $0.00), от доллара — обычные 2
const fmtUsd = v => { const n = +v || 0; return '$' + n.toFixed(Math.abs(n) >= 1 ? 2 : 4); };
const fmtMin = s => { const v = +s || 0; return v < 60 ? v.toFixed(0) + ' с' : (v/60).toFixed(1) + ' мин'; };
const fmtHrs = h => h == null ? '—' : (+h).toFixed(h >= 10 ? 0 : 1) + ' ч';
const fmtBytes = b => b == null ? '—' : (b >= 1073741824 ? (b/1073741824).toFixed(2)+' ГБ' : (b/1048576).toFixed(1)+' МБ');
const fmtDT = s => s ? new Date(s).toLocaleString('ru-RU', {hour12:false}) : '—';
const fmtDay = s => s ? String(s).slice(0, 10) : '—';
const plural = (n, one, few, many) => {
  const a = Math.abs(+n || 0) % 100, b = a % 10;
  return n + ' ' + ((a > 10 && a < 20) || b === 0 || b > 4 ? many : (b === 1 ? one : few));
};
const hue = n => { let h = 0; for (const c of String(n || '')) h = (h*31 + c.charCodeAt(0)) >>> 0; return h % 360; };
const spkCol = n => `hsl(${hue(n)},60%,70%)`;
const linkBtn = h => `<button class="lnk" data-act="link" data-h="${esc(h)}" title="скопировать ссылку">🔗</button>`;
const recTitle = r => r.title || r.filename;
// откуда приехала запись: inbox / plaud / manual
const srcBadge = s => s ? `<span class="badge src src-${esc(s)}" title="источник записи">${esc(s)}</span>` : '';
// статус записи: пока идёт скачивание из облака, «new» — это не поломка, а ожидание
function stCell(r){
  if (r.downloading) return '<span class="st st-download" title="скачиваем из облака">скачивается</span>';
  if (r.status === 'new') return '<span class="st st-new" title="new — ждёт конвейера">в очереди</span>';
  return `<span class="st st-${esc(r.status)}">${esc(r.status)}</span>`;
}
const cohCol = v => v == null ? 'var(--dim)' : (v >= 0.75 ? 'var(--green)' : (v >= 0.5 ? 'var(--yellow)' : 'var(--red)'));
const cohTxt = v => v == null ? '—' : (+v).toFixed(2);
const optList = () => VPEOPLE.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');

let errT;
function showErr(m){ $('err').textContent = m; clearTimeout(errT); errT = setTimeout(() => $('err').textContent = '', 6000); }
function fail(el, e){ if (el) el.innerHTML = '<div class="errtxt">ошибка загрузки: ' + esc((e && e.message) || e) + '</div>'; }

async function api(path, opts = {}){
  const o = {method: opts.method || 'GET', headers: {}};
  if (opts.body){ o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opts.body); }
  const r = await fetch(path, o);
  if (!r.ok){
    let msg = r.status; try { msg = (await r.json()).detail || msg; } catch (e) {}
    showErr('API: ' + msg); throw new Error(msg);
  }
  return r.json();
}

// ---------- подсветка ----------
let HL_EL = null, HL_T = null;
function clearHl(){ if (HL_EL) HL_EL.classList.remove('hl'); HL_EL = null; clearTimeout(HL_T); }
function focusEl(el, hl){
  if (!el) return;
  try { el.scrollIntoView({behavior:'smooth', block:'center'}); } catch (e) { el.scrollIntoView(); }
  if (hl === false) return;
  clearHl(); HL_EL = el; el.classList.add('hl'); HL_T = setTimeout(clearHl, 8000);
}

// ---------- буфер обмена ----------
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
async function copyLink(hash, btn){
  const url = location.origin + location.pathname + '#' + hash;
  const ok = await copyText(url);
  const prev = btn.textContent;
  btn.textContent = ok ? '✓ скопировано' : '✗ ' + url;
  btn.classList.toggle('ok', ok);
  setTimeout(() => { btn.textContent = prev; btn.classList.remove('ok'); }, 1400);
}

// ---------- единый плеер в шапке ----------
// Один <audio id="player"> на всё приложение: вкладки переключаются, звук не теряется,
// а строка состояния рядом всегда отвечает на «что это сейчас играет и как это выключить».
const PLAYER = {
  src: '',      // что загружено (логический URL, а не a.src с origin)
  title: '',    // подпись для строки состояния: запись или чей это сэмпл
  span: null,   // [start, end|null] — слушаемый отрезок
  btn: null,    // кнопка, с которой запущено: показывает ⏸, повторный клик — стоп
  label: '',    // её исходная подпись
  stop: null,   // точка остановки отрезка, сек
  queue: null,  // очередь «подряд»: {items, idx, src, title, btn, label}
};
let QT = null;    // таймер перехода к следующему фрагменту очереди
let CUT = false;  // паузу поставили мы, дойдя до конца отрезка (а не пользователь)

const AU = $('player');
const recSrc = rid => '/api/audio/' + rid;
// подпись записи для строки состояния: список записей может быть ещё не загружен
function recLabel(rid){
  const pick = l => (l || []).find(x => +x.id === +rid);
  const r = pick(RSUM) || pick(RECS);
  return 'запись #' + rid + (r ? ' · ' + recTitle(r) : '');
}

function markBtn(btn){
  releaseBtn();
  if (!btn) return;
  PLAYER.btn = btn; PLAYER.label = btn.innerHTML;
  const h = btn.innerHTML.replace('▶', '⏸');
  btn.innerHTML = (h === PLAYER.label) ? '⏸ ' + PLAYER.label : h;
  btn.classList.add('playing');
}
function releaseBtn(){
  if (PLAYER.btn){ PLAYER.btn.innerHTML = PLAYER.label; PLAYER.btn.classList.remove('playing'); }
  PLAYER.btn = null; PLAYER.label = '';
}

function renderNow(){
  const el = $('pnow');
  if (!PLAYER.src){
    el.innerHTML = '<span class="dim">ничего не играет</span>';
    $('pstop').disabled = true;
    return;
  }
  const q = PLAYER.queue;
  const sp = PLAYER.span
    ? `<span class="mono dim">${fmtT(PLAYER.span[0])}${PLAYER.span[1] != null ? '–' + fmtT(PLAYER.span[1]) : ''}</span>`
    : '';
  el.innerHTML = `<span class="pico">${AU.paused ? '⏸' : '▶'}</span><b title="${esc(PLAYER.title)}">${esc(PLAYER.title || '—')}</b>${sp}` +
    (q ? `<span class="badge">подряд ${q.idx}/${q.items.length}</span>` : '');
  $('pstop').disabled = AU.paused && !q;
}

// единая точка запуска: {src, start, end, btn, title}
function play(o){
  const fresh = PLAYER.src !== o.src;     // тот же файл не перезагружаем
  markBtn(o.btn || null);
  PLAYER.title = o.title || '';
  const st = (o.start == null) ? null : +o.start;
  const en = (o.end != null && +o.end > (st || 0)) ? +o.end : null;
  PLAYER.span = (st == null) ? null : [st, en];
  // точку остановки ставим ВНУТРИ go(): смена src бросает 'emptied', чей обработчик
  // её обнуляет — иначе отрезок играл бы до конца записи
  const go = () => {
    CUT = false;
    PLAYER.stop = en;
    if (st != null){ try { AU.currentTime = st; } catch (e) {} }
    AU.play().catch(() => {});
    renderNow();
  };
  if (fresh){ PLAYER.src = o.src; AU.src = o.src; }
  else if (AU.readyState >= 1){ go(); return; }
  if (st == null){ AU.load(); go(); return; }   // играем целиком — метаданные ждать незачем
  // без load() браузер может не начать качать метаданные и loadedmetadata не наступит
  AU.addEventListener('loadedmetadata', go, {once: true});
  AU.load();
  renderNow();
}

function stopAll(){
  endQueue();
  PLAYER.stop = null; CUT = false;
  try { AU.pause(); } catch (e) {}
  releaseBtn();
  renderNow();
}
// повторный клик по той же кнопке = стоп
function toggleSame(btn){
  if (PLAYER.btn === btn && !AU.paused){ stopAll(); return true; }
  return false;
}
// подложить запись в плеер, не запуская: клик по реплике не будет ждать сеть.
// Если уже играет что-то другое — не перебиваем.
function preload(src, title){
  if (PLAYER.src === src){ PLAYER.title = title; renderNow(); return; }
  if (!AU.paused) return;
  PLAYER.src = src; PLAYER.title = title; PLAYER.span = null; PLAYER.stop = null;
  AU.src = src; AU.load();
  renderNow();
}

function playSpan(rid, start, end, btn){
  if (toggleSame(btn)) return;
  endQueue();
  play({src: recSrc(rid), start, end, btn, title: recLabel(rid)});
}
function playSample(sid, btn, who){
  if (toggleSame(btn)) return;
  endQueue();
  play({src: '/api/speakers/sample/' + sid, start: 0, btn, title: 'сэмпл · ' + (who || '#' + sid)});
}

// очередь фрагментов кластера: играем подряд, чтобы составить впечатление о голосе
function startQueue(items, src, title, btn){
  endQueue(); releaseBtn();
  PLAYER.queue = {items, idx: 0, src, title, btn, label: btn ? btn.innerHTML : ''};
  playQueue();
}
function playQueue(){
  const q = PLAYER.queue;
  if (!q) return;
  if (q.idx >= q.items.length){ stopAll(); return; }
  const t = q.items[q.idx++];
  if (q.btn){ q.btn.innerHTML = `⏸ подряд ${q.idx}/${q.items.length}`; q.btn.classList.add('playing'); }
  play({src: q.src, start: t.start_sec, end: t.end_sec, title: q.title});
}
function endQueue(){
  clearTimeout(QT); QT = null;
  const q = PLAYER.queue;
  PLAYER.queue = null;
  if (q && q.btn){ q.btn.innerHTML = q.label; q.btn.classList.remove('playing'); }
}

// auto=true — доиграли отрезок сами; false — остановил пользователь, очередь прекращаем
function halted(auto){
  if (PLAYER.queue){
    if (auto){ clearTimeout(QT); QT = setTimeout(() => { QT = null; playQueue(); }, 150); return; }
    endQueue();
  }
  PLAYER.stop = null;
  releaseBtn();
  renderNow();
}
AU.addEventListener('timeupdate', () => {          // отрезок играем только до его конца
  if (PLAYER.stop != null && AU.currentTime >= PLAYER.stop){
    PLAYER.stop = null; CUT = true; AU.pause();
  }
});
AU.addEventListener('pause', () => { const c = CUT; CUT = false; halted(c); });
AU.addEventListener('ended', () => { CUT = false; halted(true); });
AU.addEventListener('play', renderNow);
// смена src бросает 'emptied' — это не конец фрагмента: очередь по нему не двигаем
AU.addEventListener('emptied', () => { PLAYER.stop = null; renderNow(); });
// файла нет / отдался битым — иначе кнопка навсегда осталась бы в ⏸
AU.addEventListener('error', () => {
  endQueue(); PLAYER.stop = null; releaseBtn(); renderNow();
  showErr('аудио недоступно: ' + PLAYER.src);
});

// ---------- роутер ----------
const TAB_HASH = {jobs:'jobs', tr:'transcript', voices:'voices', disk:'disk', sp:'speakers', usage:'usage'};
let LAST_HASH = null, ROUTING = false, NEXT = null;

const curHash = () => location.hash.replace(/^#/, '');

function setHash(h, push){
  LAST_HASH = h;
  if (curHash() === h) return;
  try { history[push ? 'pushState' : 'replaceState'](null, '', '#' + h); }
  catch (e) { location.hash = h; }
}

function parseHash(h){
  let s = '';
  try { s = decodeURIComponent(h || ''); } catch (e) { s = h || ''; }
  s = s.replace(/^\/+|\/+$/g, '');
  if (!s) return {tab:'jobs'};
  const p = s.split('/');
  if (p[0] === 'jobs')
    return {tab:'jobs', rid: /^\d+$/.test(p[1] || '') ? +p[1] : null};
  if (p[0] === 'transcript'){
    const r = {tab:'tr', rid:null, sec:null, segId:null};
    if (p[1]){
      const m = /^(\d+)(?:@(\d+(?:[.,]\d+)?))?$/.exec(p[1]);
      if (!m) return {tab:'tr'};
      r.rid = +m[1];
      if (m[2] != null) r.sec = parseFloat(m[2].replace(',', '.'));
    }
    if (p[2] === 'seg' && /^\d+$/.test(p[3] || '')) r.segId = p[3];
    return r;
  }
  if (p[0] === 'voices'){
    if (p[1] === 'enroll')
      return {tab:'voices', vsec:'enroll', rid: /^\d+$/.test(p[2] || '') ? +p[2] : null};
    if (p[1] === 'suggestions') return {tab:'voices', vsec:'sugg'};
    return {tab:'voices', vsec:'people', spId: /^\d+$/.test(p[1] || '') ? +p[1] : null};
  }
  if (p[0] === 'conflicts')
    return {tab:'sp', toConf:true, confId: /^\d+$/.test(p[1] || '') ? +p[1] : null};
  if (p[0] === 'speakers') return {tab:'sp'};
  if (p[0] === 'disk') return {tab:'disk'};
  if (p[0] === 'usage') return {tab:'usage'};
  return {tab:'jobs', bad:true};
}

async function route(h, hl){
  if (ROUTING){ NEXT = [h, hl]; return; }   // не терять навигацию, пришедшую во время загрузки
  ROUTING = true;
  try {
    const r = parseHash(h);
    if (r.bad) setHash('jobs', false);      // битый хэш — молча на дефолт
    await showTab(r, hl === true);
  } catch (e) {}
  finally {
    ROUTING = false;
    if (NEXT){ const n = NEXT; NEXT = null; route(n[0], n[1]).catch(() => {}); }
  }
}

async function go(h, push, hl){ setHash(h, push); await route(h, hl); }

function onHashNav(){
  const h = curHash();
  if (h === LAST_HASH) return;   // наш собственный replaceState/pushState
  LAST_HASH = h;
  route(h, true).catch(() => {});
}
window.addEventListener('hashchange', onHashNav);
window.addEventListener('popstate', onHashNav);

async function showTab(r, hl){
  TAB = r.tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === TAB));
  document.querySelectorAll('.tab').forEach(s => s.style.display = (s.id === 'tab-' + TAB) ? '' : 'none');
  if (TAB === 'jobs'){
    if (r.rid != null) OPEN = r.rid;
    await loadJobs();
    if (r.rid != null) focusEl(document.querySelector('tr[data-rid="' + r.rid + '"]'), hl);
  } else if (TAB === 'tr'){
    await applyTr(r);
  } else if (TAB === 'voices'){
    await showVoices(r);
  } else if (TAB === 'disk'){
    await loadDisk();
  } else if (TAB === 'usage'){
    await loadUsage();
  } else if (TAB === 'sp'){
    await loadSp();
    if (r.confId != null){
      const el = document.querySelector('.card[data-cid="' + r.confId + '"]');
      if (el) focusEl(el, true);
      else { $('confNote').textContent = 'конфликт #' + r.confId + ' не в списке открытых (уже разобран?)'; focusEl($('confHead'), false); }
    } else if (r.toConf) focusEl($('confHead'), false);
  }
}

      esc((e && e.message) || e) + '</td></tr>';

function renderJobs(){

  const rows = RECS.map(r => {
    let h = `<tr data-act="row" data-rid="${r.id}">
      <td class="mono">${r.id}</td>

      <td class="mono${r.open_conflicts > 0 ? ' errtxt' : ' dim'}">${r.open_conflicts}</td>

function toggleRec(id){
  OPEN = (OPEN === id) ? null : id;
  renderJobs();
  if (OPEN != null){ setHash('jobs/' + id, true); loadDetail(OPEN).catch(() => {}); }
  else setHash('jobs', false);
}

async function loadDetail(id){
  let d;
  try { d = await api('/api/recordings/' + id); } catch (e) { fail($('recdet'), e); return; }
  const el = $('recdet');
  if (!el || OPEN !== id) return;
  const pipe = d.jobs.map(stageCard).join('<div class="arr">→</div>') || '<span class="dim">этапов нет</span>';
  const rep = ['draft','quality','resolve'].map(s =>
    `<button class="act" data-act="rep" data-rid="${id}" data-stage="${s}">↻ переиграть с ${s}</button>`).join(' ');
  el.classList.remove('dim');
  el.innerHTML = `<div class="sub">${esc(d.filename)} · источник ${esc(d.source || '—')}${
      d.started_at ? ' · запись начата ' + fmtDT(d.started_at) : ''}${
      d.has_audio ? '' : (d.audio_path ? ' · <span class="errtxt">аудиофайла нет на диске</span>' : ' · аудио удалено')}</div>
    <div class="pipe">${pipe}</div>
    <div class="rsrow">${rep}
      <button class="act" data-act="goto" data-h="transcript/${id}">транскрипт →</button>
      <button class="act" data-act="goto" data-h="voices/enroll/${id}">разметить голоса →</button></div>`;
}

function stageCard(j){
  const dur = (j.started_at && j.finished_at)
    ? ((new Date(j.finished_at) - new Date(j.started_at)) / 1000).toFixed(1) + 'с' : '';
  return `<div class="stage">
    <div><b>${esc(j.stage)}</b> <span class="st st-${esc(j.status)}">${esc(j.status)}</span></div>
    <div class="dim mono">${j.started_at ? fmtDT(j.started_at) : '—'}${j.finished_at ? ' → ' + fmtDT(j.finished_at) : ''}${dur ? ' · ' + dur : ''}</div>
    <div class="mono">${fmtUsd(j.cost_usd)}</div>
    ${j.artifact_path ? `<div><a href="/api/artifacts/${j.id}" target="_blank" rel="noopener">артефакт</a></div>` : ''}
    ${j.error ? `<div class="errtxt" title="${esc(j.error)}">${esc(String(j.error).slice(0, 200))}</div>` : ''}
  </div>`;
}

// ---------- Транскрипт: список записей ----------
// бейдж спикера: имя + сколько он говорил, цвет — тот же, что в ленте сегментов
function spkBadges(list, max){
  const all = list || [];
  const head = max ? all.slice(0, max) : all;
  const rest = all.length - head.length;
  if (!all.length) return '<span class="sub">спикеры не размечены</span>';
  return head.map(s => `<span class="badge spkb" style="color:${spkCol(s.name)};border-color:${spkCol(s.name)}"
      title="${esc(s.name)}: ${plural(s.segments, 'реплика', 'реплики', 'реплик')}">${esc(s.name)} · ${fmtMin(s.sec)}</span>`).join('') +
    (rest > 0 ? `<span class="badge">ещё ${rest}</span>` : '');
}

const recRows = list => list.length ? list.map(recRow).join('')
  : '<div class="dim">записей нет — положите файл в data/inbox</div>';

// в список возвращаются после разметки — перечитываем всегда, но сначала рисуем кэш, без мигания
async function loadTrList(){
  const el = $('trList');
  el.innerHTML = RSUM ? recRows(RSUM) : '<div class="dim">загрузка…</div>';
  let d;
  try { d = await api('/api/recordings/summary'); } catch (e) { if (!RSUM) fail(el, e); return; }
  RSUM = d;
  el.innerHTML = recRows(RSUM);
}

function recRow(r){
  return `<div class="rec" data-act="trgo" data-rid="${r.id}">
    <div class="main">
      <div class="rtitle">${esc(recTitle(r))} ${srcBadge(r.source)}${
        r.has_audio === false ? '<span class="badge bad" title="аудиофайла нет на диске">без аудио</span>' : ''}</div>
      <div class="sub">#${r.id}${r.title && r.title !== r.filename ? ' · ' + esc(r.filename) : ''}</div>
      <div class="spks">${spkBadges(r.speakers, 8)}</div>
    </div>
    <div class="meta">
      <div class="rdate mono">${fmtDT(r.started_at || r.created_at)}</div>
      <div class="sub mono">${fmtT(r.duration_sec)} · ${r.segments} сегм.${
        r.ambiguous ? ' · <span class="errtxt">спорных ' + r.ambiguous + '</span>' : ''}</div>
      <div style="margin-top:4px">${stCell(r)}${linkBtn('transcript/' + r.id)}</div>
    </div>
  </div>`;
}

function trHead(r){
  if (!r) return '<span class="errtxt">записи нет в списке — возможно, её удалили</span>';
  return `<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
      <b style="font-size:16px">${esc(recTitle(r))}</b>
      <span class="dim mono">${fmtDT(r.started_at || r.created_at)}</span>
      <span class="dim mono">${fmtT(r.duration_sec)} · ${r.segments} сегм.</span>
      ${srcBadge(r.source)}
      ${r.ambiguous ? `<span class="badge bad">спорных ${r.ambiguous}</span>` : ''}
      ${r.has_audio === false ? '<span class="badge bad" title="файл не найден в data/">аудио недоступно</span>' : ''}
      ${linkBtn('transcript/' + r.id)}
    </div>
    <div class="sub">${esc(r.filename)}</div>
    <div class="spks">${spkBadges(r.speakers)}</div>`;
}

async function applyTr(r){
  const rid = (r && r.rid != null) ? r.rid : null;
  if (rid == null){                       // #transcript без id — список записей
    $('trWrap').style.display = 'none';
    $('trList').style.display = '';
    CUR_RID = null; showHint(null);   // плеер в шапке не трогаем: звук не должен обрываться
    await loadTrList();
    return;
  }
  $('trList').style.display = 'none';
  $('trWrap').style.display = '';
  if (CUR_RID !== rid) await loadSegments(rid);
  if (CUR_RID !== rid) return;            // не загрузилось — сообщение уже показано
  if (r && (r.segId != null || r.sec != null)) jumpTo(r);
  else { showHint(null); setHash('transcript/' + rid, false); }
}

async function loadSegments(rid){
  rid = +rid;
  if (!rid){ CUR_RID = null; return; }
  $('trWrap').style.display = '';
  $('segList').innerHTML = '<div class="dim">загрузка…</div>';
  let segs, confs, spk, sum;
  try {
    [segs, confs, spk, sum] = await Promise.all([
      api('/api/recordings/' + rid + '/segments'),
      api('/api/conflicts?status=open'),
      api('/api/speakers'),
      RSUM ? Promise.resolve(RSUM) : api('/api/recordings/summary'),
    ]);
  } catch (e) { fail($('segList'), e); return; }
  SEGS = segs; SPK = spk; CUR_RID = rid; RSUM = sum;
  CONF_BY_SEG = {};
  confs.forEach(c => { CONF_BY_SEG[String(c.segment_id)] = c.id; });
  const rec = RSUM.find(x => x.id === rid);
  TR_AUDIO = !rec || rec.has_audio !== false;
  $('trHead').innerHTML = trHead(rec);
  // подкладываем запись в общий плеер (не перебивая то, что уже играет)
  if (TR_AUDIO) preload(recSrc(rid), recLabel(rid));
  $('segList').innerHTML = SEGS.map(segHtml).join('') ||
    '<div class="dim">сегментов нет — запись ещё не прошла конвейер</div>';
}

function segHtml(s, i){
  const low = s.confidence != null && s.confidence < 0.7;
  let badges = '';
  if (s.confidence != null) badges += `<span class="badge${low ? ' bad' : ''}">${(+s.confidence).toFixed(2)}</span>`;
  if (s.inherited) badges += '<span class="badge">насл.</span>';
  const tog = s.ambiguous ? `<button class="act" data-act="tog" data-i="${i}">разбор</button>` : '';
  return `<div class="seg${s.ambiguous ? ' amb' : ''}" data-t="${+s.start_sec}" data-id="${s.id}" data-i="${i}">
      <span class="t">${fmtT(s.start_sec)}</span>
      <span class="spk" style="color:${spkCol(s.speaker_name)}">${esc(s.speaker_name)}</span>
      ${badges}
      <span class="txt"${low ? ' style="opacity:.55"' : ''} title="asr_logprob: ${s.asr_logprob != null ? (+s.asr_logprob).toFixed(3) : '—'}">${esc(s.text)}</span>
      ${tog}${linkBtn('transcript/' + CUR_RID + '/seg/' + s.id)}
    </div>` + (s.ambiguous ? panelHtml(s, i) : '');
}

function panelHtml(s, i){
  const d = s.detail || {}, cid = CONF_BY_SEG[String(s.id)];
  let h = `<div class="pan" id="pan${i}" style="display:none">`;
  if (Array.isArray(d.top) && d.top.length)
    h += '<div class="cand">top: ' + d.top.map(t =>
      `<span style="color:${spkCol(t.name)}">${esc(t.name)} · cos ${(+t.cos).toFixed(2)}</span>`).join('') + '</div>';
  if (d.cluster_default)
    h += `<div class="dim">cluster_default: ${esc(d.cluster_default.name)} · ${(+d.cluster_default.cos).toFixed(2)}</div>`;
  if (d.resolution) h += `<div class="dim">resolution: ${esc(d.resolution)}</div>`;
  if (cid) h += resolveRow(cid);
  else h += '<div class="dim">открытого конфликта нет</div>';
  return h + '</div>';
}

function resolveRow(cid){
  return '<div class="rsrow">' +
    SPK.map((p, n) => `<button class="act" data-act="rs" data-cid="${cid}" data-n="${n}" style="color:${spkCol(p.name)}">${esc(p.name)}</button>`).join('') +
    `<input placeholder="новое имя"><button class="act" data-act="rsnew" data-cid="${cid}">OK</button>` +
    linkBtn('conflicts/' + cid) + '</div>';
}

// перемотка без запуска — только если в плеере действительно эта запись
function seekOnly(t){
  if (PLAYER.src !== recSrc(CUR_RID)) return;
  const go = () => { try { AU.currentTime = t; } catch (e) {} PLAYER.span = [t, null]; renderNow(); };
  if (AU.readyState >= 1) go(); else AU.addEventListener('loadedmetadata', go, {once: true});
}

function seekPlay(t){
  if (!TR_AUDIO){ showErr('аудио недоступно'); return; }
  play({src: recSrc(CUR_RID), start: t, title: recLabel(CUR_RID)});
  $('playHint').style.display = 'none';
}

function showHint(t){
  PEND_T = t;
  if (t == null || !TR_AUDIO){ $('playHint').style.display = 'none'; return; }
  $('playHintT').textContent = fmtT(t);
  $('playHint').style.display = '';
}

// прыжок к сегменту/моменту из хэша: без автоплея, с подсветкой
function jumpTo(r){
  let s = null;
  if (r.segId != null) s = SEGS.find(x => String(x.id) === String(r.segId));
  else if (r.sec != null){
    for (const x of SEGS){ if (+x.start_sec <= r.sec + 0.01) s = x; else break; }
    if (!s && SEGS.length) s = SEGS[0];
  }
  const t = (r.sec != null) ? r.sec : (s ? +s.start_sec : null);
  if (t != null) seekOnly(t);
  showHint(t);
  if (!s) return;
  const el = document.querySelector('.seg[data-id="' + s.id + '"]');
  focusEl(el, true);
  if (s.ambiguous && el){ const p = $('pan' + el.dataset.i); if (p) p.style.display = ''; }
}

async function resolveConflict(cid, name){
  await api('/api/conflicts/' + cid + '/resolve', {method: 'POST', body: {name}});
  RSUM = null;   // изменилось число спорных сегментов — сводку перечитать
  if (TAB === 'tr' && CUR_RID != null){ const r = CUR_RID; CUR_RID = null; await loadSegments(r); }
  if (TAB === 'sp') loadSp().catch(() => {});
  if (TAB === 'jobs') loadJobs().catch(() => {});
}

// ---------- Голоса ----------
async function showVoices(r){
  VSEC = r.vsec || 'people';
  document.querySelectorAll('#vnav button').forEach(b => b.classList.toggle('on', b.dataset.vsec === VSEC));
  document.querySelectorAll('.vsec').forEach(s => s.style.display = (s.id === 'vsec-' + VSEC) ? (s.id === 'vsec-people' ? 'flex' : '') : 'none');
  if (VSEC === 'people'){
    await loadPeople();
    if (r.spId != null) await openPerson(r.spId);
  } else if (VSEC === 'enroll'){
    if (!VPEOPLE.length) await loadPeople();
    await initEnroll(r.rid);
  } else {
    if (!VPEOPLE.length) await loadPeople();
    await loadSugg();
  }
}

async function loadPeople(){
  try { VPEOPLE = await api('/api/speakers'); }
  catch (e) { fail($('peopleList'), e); return; }
  $('peopleList').innerHTML = VPEOPLE.length ? VPEOPLE.map(p => `
    <div class="pitem${VPERSON && VPERSON.id === p.id ? ' on' : ''}" data-act="person" data-id="${p.id}">
      <div><b style="color:${spkCol(p.name)}">${esc(p.name)}</b></div>
      ${p.aliases && p.aliases.length ? `<div class="sub">${esc(p.aliases.join(', '))}</div>` : ''}
      <div class="sub">${p.active} акт.${p.inactive ? ' · ' + p.inactive + ' искл.' : ''} · когерентность
        <span style="color:${cohCol(p.avg_coherence)}">${cohTxt(p.avg_coherence)}</span></div>
    </div>`).join('') : '<div class="dim">людей в базе нет</div>';
}

async function openPerson(id, push){
  try { VPERSON = await api('/api/speakers/' + id + '/detail'); }
  catch (e) { fail($('personCard'), e); return; }
  renderPerson();
  document.querySelectorAll('.pitem').forEach(el => el.classList.toggle('on', +el.dataset.id === +id));
  setHash('voices/' + id, push === true);
}

function renderPerson(){
  const p = VPERSON;
  const rows = p.samples.map(s => `<tr${s.is_active ? '' : ' class="off"'}>
    <td>${s.has_path ? `<button class="act" data-act="vplay" data-sid="${s.id}" data-who="${esc(p.name)}">▶</button>`
      : '<button class="act" disabled title="аудио недоступно">▶</button>'}</td>
    <td class="mono">${s.duration_sec != null ? (+s.duration_sec).toFixed(1) + 'с' : '—'}</td>

async function initEnroll(rid){
  if (!RECS.length){ try { RECS = await api('/api/recordings'); } catch (e) { fail($('enrollBody'), e); return; } }
  const sel = $('enrollSel');
  sel.innerHTML = RECS.map(r => `<option value="${r.id}">#${r.id} · ${esc(recTitle(r))}</option>`).join('');
  let id = (rid != null && RECS.some(r => r.id === rid)) ? rid : (RECS.length ? RECS[0].id : null);
  if (id == null){ $('enrollBody').innerHTML = '<div class="dim">записей нет</div>'; return; }

}

async function enrollAct(card, kind){
  // в эталон идёт самый длинный НЕспорный фрагмент (его выбрал бэкенд), а не просто первый
  const g = ECAND.groups[+card.dataset.i], res = card.querySelector('.eres'),
        best = g.enroll_span || g.top.find(t => !t.ambiguous) || g.top[0];
  let name = '', mode = 'existing', aliases = [];
  if (kind === 'who'){
    name = card.querySelector('[data-role="who"]').value;
    if (!name){ res.textContent = 'выберите человека в списке'; return; }
  } else if (kind === 'new'){
    name = card.querySelector('[data-role="nname"]').value.trim();
    aliases = card.querySelector('[data-role="nalias"]').value.split(',').map(s => s.trim()).filter(Boolean);
    mode = 'new_speaker';
    if (!name){ res.textContent = 'введите имя'; return; }
  } else {
    name = '[noise]';
  }
  res.style.color = ''; res.textContent = 'работаю…';
  let msg = '';
  try {
    if (kind !== 'trash' && best && ECAND.has_audio){
      const e = await api('/api/enroll', {method:'POST', body:{
        recording_id: ERID, start_sec: best.start_sec, end_sec: best.end_sec,
        speaker_name: name, mode, aliases}});
      msg = ` · стало ${e.samples_total} сэмплов (${e.active} активных) · coherence нового ${cohTxt(e.coherence)}` +
            ` · новый матч фрагмента: ${e.match.map(m => m.name + ' ' + (+m.cos).toFixed(2)).join(' · ')}`;
    }
    const r = await api('/api/enroll/rename_cluster', {method:'POST', body:{
      recording_id: ERID, from_label: g.label, to_name: name}});
    res.style.color = 'var(--green)';
    res.textContent = `переименовано сегментов: ${r.updated}` +
      (r.conflicts_closed ? `, закрыто конфликтов: ${r.conflicts_closed}` : '') + msg;
    card.querySelector('.rsrow').style.display = 'none';
    g.label = name;
    loadPeople().catch(() => {});
  } catch (e) {
    res.style.color = 'var(--red)';
    res.textContent = 'не вышло: ' + ((e && e.message) || e);
  }
}

// столбики по дням: inline SVG, без библиотек; шкала — по максимуму дня или бюджету
function usageChart(days, budget){
  const W = 720, H = 170, L = 48, R = 10, T = 12, B = 26;
  const n = Math.max(days.length, 1), bw = (W - L - R) / n;
  const max = Math.max(budget > 0 ? budget : 0, ...days.map(d => +d.usd || 0), 0.01);
  const y = v => T + (H - T - B) * (1 - v / max);
  const bars = days.map((d, i) => {
    const v = +d.usd || 0, top = y(v), h = Math.max(H - B - top, v > 0 ? 2 : 0);
    const over = budget > 0 && v > budget;
    return `<rect x="${(L + i*bw + 2).toFixed(1)}" y="${(H - B - h).toFixed(1)}"
        width="${Math.max(bw - 4, 1).toFixed(1)}" height="${h.toFixed(1)}" rx="2"
        fill="${v > 0 ? (over ? 'var(--red)' : 'var(--acc)') : 'var(--border)'}"
        ><title>${esc(d.day)} — ${fmtUsd(v)}, ${plural(d.calls, 'вызов', 'вызова', 'вызовов')}</title></rect>`;
  }).join('');
  const labels = days.map((d, i) => (i % 2 === 0 || i === days.length - 1)
    ? `<text x="${(L + i*bw + bw/2).toFixed(1)}" y="${H - 8}" text-anchor="middle"
         font-size="10" fill="var(--dim)">${esc(d.day.slice(8) + '.' + d.day.slice(5, 7))}</text>` : '').join('');
  const bl = (budget > 0 && budget <= max)
    ? `<line x1="${L}" y1="${y(budget).toFixed(1)}" x2="${W-R}" y2="${y(budget).toFixed(1)}"
         stroke="var(--yellow)" stroke-dasharray="4 4"/>
       <text x="${W-R}" y="${(y(budget) - 4).toFixed(1)}" text-anchor="end" font-size="10"
         fill="var(--yellow)">бюджет ${fmtUsd(budget)}/день</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img">
    <line x1="${L}" y1="${T}" x2="${W-R}" y2="${T}" stroke="var(--border)" stroke-dasharray="2 4"/>
    <line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="var(--border)"/>
    <text x="${L-6}" y="${T+4}" text-anchor="end" font-size="10" fill="var(--dim)">${fmtUsd(max)}</text>
    <text x="${L-6}" y="${H-B}" text-anchor="end" font-size="10" fill="var(--dim)">$0</text>
    ${bl}${bars}${labels}</svg>`;
}

  try { [spk, confs] = await Promise.all([api('/api/speakers'), api('/api/conflicts?status=open')]); }
  catch (e) { fail($('spkList'), e); $('confList').innerHTML = ''; return; }
  SPK = spk; VPEOPLE = spk;
  $('confNote').textContent = '';
  $('spkList').innerHTML = spk.map(spCard).join('') || '<div class="dim">людей в базе нет</div>';
  $('confList').innerHTML = confs.map(confCard).join('') || '<div class="dim">открытых конфликтов нет</div>';
}

function spCard(p){
  const counts = Object.entries(p.sample_counts || {}).map(([k, v]) => `${esc(k)}: ${v}`).join(' · ') || 'нет сэмплов';
  const btns = (p.samples || []).filter(s => s.has_path).map(s =>
    `<button class="act${s.is_active ? '' : ' off'}" data-act="vplay" data-sid="${s.id}" data-who="${esc(p.name)}">▶ ${esc(s.kind)}${s.duration_sec ? ' ' + (+s.duration_sec).toFixed(1) + 'с' : ''}</button>`).join('');
  return `<div class="card" style="min-width:260px">
    <div><b style="color:${spkCol(p.name)}">${esc(p.name)}</b> ${linkBtn('voices/' + p.id)}</div>
    ${p.aliases && p.aliases.length ? `<div class="dim">${esc(p.aliases.join(', '))}</div>` : ''}
    <div class="dim">${counts}</div>
    <div class="sub">когерентность <span style="color:${cohCol(p.avg_coherence)}">${cohTxt(p.avg_coherence)}</span>${p.inactive ? ' · исключено ' + p.inactive : ''}</div>
    <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">${btns}</div>
  </div>`;
}

function confCard(c){
  const d = c.detail || {};
  const top = Array.isArray(d.top) ? d.top.map(t => `${esc(t.name)} ${(+t.cos).toFixed(2)}`).join(' · ') : '';
  return `<div class="card" data-cid="${c.id}" style="width:100%">
    <div class="dim">#${c.id} · ${esc(c.reason)} · запись #${c.recording_id} · ${fmtT(c.start_sec)}–${fmtT(c.end_sec)} ·
      <span style="color:${spkCol(c.speaker_name)}">${esc(c.speaker_name)}</span>${c.confidence != null ? ' · ' + (+c.confidence).toFixed(2) : ''}
      ${linkBtn('conflicts/' + c.id)}</div>
    <div style="margin:6px 0">«${esc(c.text)}»</div>
    ${top ? `<div class="dim">top: ${top}${d.cluster_default ? ' · cluster: ' + esc(d.cluster_default.name) : ''}</div>` : ''}
    <div class="rsrow">
      <button class="act" data-act="vspan" data-rid="${c.recording_id}" data-s="${c.start_sec}" data-e="${c.end_sec}"${
        c.has_audio === false ? ' disabled title="аудио недоступно"' : ''}>▶ слушать</button>
      <button class="lnk" data-act="goto" data-h="transcript/${c.recording_id}/seg/${c.segment_id}" title="открыть в транскрипте">↗</button>
      ${SPK.map((p, n) => `<button class="act" data-act="rs" data-cid="${c.id}" data-n="${n}" style="color:${spkCol(p.name)}">${esc(p.name)}</button>`).join('')}
      <input placeholder="новое имя"><button class="act" data-act="rsnew" data-cid="${c.id}">OK</button>
    </div>
  </div>`;
}

// ---------- события ----------
document.addEventListener('click', async e => {
  if (HL_EL && !e.target.closest('.hl')) clearHl();
  const nb = e.target.closest('nav button');
  if (nb){ go(TAB_HASH[nb.dataset.tab], false).catch(() => {}); return; }
  const vb = e.target.closest('#vnav button');
  if (vb){
    const h = {people:'voices', enroll:'voices/enroll', sugg:'voices/suggestions'}[vb.dataset.vsec];
    go(h, false).catch(() => {});
    return;
  }
  const b = e.target.closest('[data-act]');
  if (b){
    try {
      const a = b.dataset.act, card = b.closest('.card');
      if (a === 'link') await copyLink(b.dataset.h, b);
      else if (a === 'goto') await go(b.dataset.h, true, true);
      else if (a === 'row') toggleRec(+b.dataset.rid);
      else if (a === 'trgo') await go('transcript/' + b.dataset.rid, true);
      else if (a === 'tog'){ const p = $('pan' + b.dataset.i); if (p) p.style.display = p.style.display === 'none' ? '' : 'none'; }
      else if (a === 'rs') await resolveConflict(+b.dataset.cid, SPK[+b.dataset.n].name);
      else if (a === 'rsnew'){
        const inp = b.parentElement.querySelector('input');
        const v = (inp && inp.value || '').trim();
        if (v) await resolveConflict(+b.dataset.cid, v);
      }
      else if (a === 'pstop') stopAll();
      else if (a === 'playat'){ if (PEND_T != null) seekPlay(PEND_T); }
      else if (a === 'person') await openPerson(+b.dataset.id, true);
      else if (a === 'vplay') playSample(b.dataset.sid, b, b.dataset.who);
      else if (a === 'vspan') playSpan(b.dataset.rid, b.dataset.s, b.dataset.e, b);
      else if (a === 'econf' || a === 'eother' || a === 'enoise'){
        // решение по одной спорной реплике: подтвердить / отдать другому / в шум
        const row = b.closest('.frag');
        let name;
        if (a === 'econf') name = ECAND.groups[+b.dataset.i].label;
        else if (a === 'enoise') name = '[noise]';
        else {
          const sel = row && row.querySelector('[data-role="other"]');
          name = sel && sel.value;
          if (!name){ alert('выберите человека в списке рядом'); return; }
        }
        const old = b.innerHTML;
        b.disabled = true; b.innerHTML = '…';
        try {
          const r = await api('/api/enroll/confirm_segment', {method:'POST',
            body:{segment_id: +b.dataset.seg, name}});
          if (row){
            row.classList.remove('amb');
            const bad = row.querySelector('.badge.bad'); if (bad) bad.remove();
            row.querySelectorAll('[data-act="econf"],[data-act="eother"],[data-act="enoise"],[data-role="other"]')
               .forEach(el => el.remove());
            const mark = document.createElement('span');
            mark.className = 'badge';
            mark.style.color = a === 'enoise' ? 'var(--dim)' : 'var(--green)';
            mark.textContent = a === 'enoise' ? '🗑 шум' : '✓ ' + name;
            row.insertBefore(mark, row.querySelector('.txt'));
          }
          const res = card ? card.querySelector('.eres') : null;
          if (res && !r.noise){
            res.style.color = 'var(--green)';
            res.textContent = `эталонов у ${name}: ${r.samples_total}` +
              (r.coherence != null ? ` · когерентность нового ${(+r.coherence).toFixed(2)}` : '') +
              ` · матч: ${(r.match || []).map(m => m.name + ' ' + (+m.cos).toFixed(2)).join(' · ')}`;
          } else if (res){
            res.style.color = 'var(--dim)';
            res.textContent = 'реплика помечена как шум/фон, эталон не создан';
          }
          loadPeople().catch(() => {});
        } catch (e){
          b.disabled = false; b.innerHTML = old;
          alert('не получилось: ' + ((e && e.message) || e));
        }
      }
      else if (a === 'vmore'){
        b.closest('.ecard').querySelectorAll('[data-extra]').forEach(el => el.style.display = '');
        b.remove();
      }
      else if (a === 'vqueue'){
        const g = ECAND.groups[+b.dataset.i];
        if (PLAYER.queue && PLAYER.queue.btn === b){ stopAll(); return; }
        startQueue(g.top.filter(t => !t.ambiguous).slice(0, 12),
                   recSrc(ECAND.recording_id), recLabel(ECAND.recording_id) + ' · ' + g.label, b);
      }
      else if (a === 'vtog'){
        const res = await api('/api/speakers/sample/' + b.dataset.sid + '/toggle', {method:'POST'});
        if (VPERSON){
          VPERSON.samples.forEach(s => {
            if (String(s.id) === String(b.dataset.sid)) s.is_active = res.is_active;
            if (res.coherence[s.id] !== undefined) s.coherence = res.coherence[s.id];
          });
          VPERSON.active = res.active; VPERSON.inactive = res.inactive;
          VPERSON.avg_coherence = res.avg_coherence;
          renderPerson();
        }
        loadPeople().catch(() => {});
      }
      else if (a === 'vdel'){
        if (!confirm('Убрать сэмпл из базы навсегда? Аудиофайл на диске останется.')) return;
        await api('/api/speakers/sample/' + b.dataset.sid, {method:'DELETE'});
        if (VPERSON) await openPerson(VPERSON.id);
        loadPeople().catch(() => {});
      }
      else if (a === 'sexcl'){
        await api('/api/speakers/sample/' + b.dataset.sid + '/toggle', {method:'POST'});
        await loadSugg(); loadPeople().catch(() => {});
      }
      else if (a === 'ereload') await loadCandidates(+$('enrollSel').value);
      else if (a === 'ewho') await enrollAct(card, 'who');
      else if (a === 'enew') await enrollAct(card, 'new');
      else if (a === 'etrash'){
        if (confirm('Пометить весь кластер как мусор/фон? Эталон добавлен не будет.'))
          await enrollAct(card, 'trash');
      }
      else if (a === 'sname'){
        const who = card.querySelector('[data-role="who"]').value;
        if (!who){ card.querySelector('.eres').textContent = 'выберите человека в списке'; return; }
        await suggEnroll(card, b.dataset.rid, who, b.dataset.s, b.dataset.e, b.dataset.label);
      }
      else if (a === 'sadd') await suggEnroll(card, b.dataset.rid, b.dataset.name, b.dataset.s, b.dataset.e, null);
      else if (a === 'rep'){
        if (confirm('Переиграть запись #' + b.dataset.rid + ' с этапа ' + b.dataset.stage + '?')){
          await api('/api/recordings/' + b.dataset.rid + '/reprocess', {method: 'POST', body: {from_stage: b.dataset.stage}});
          await loadJobs();
        }
      }
    } catch (err) {}
    return;
  }
  const sg = e.target.closest('.seg');
  if (sg && sg.dataset.t !== undefined){
    seekPlay(+sg.dataset.t);
    setHash('transcript/' + CUR_RID + '/seg/' + sg.dataset.id, false);
  }
});

$('enrollSel').addEventListener('change', async () => {
  const v = +$('enrollSel').value;
  if (v){ setHash('voices/enroll/' + v, false); await loadCandidates(v); }
});

setInterval(() => { if (TAB === 'jobs' && !ROUTING) loadJobs().catch(() => {}); }, 5000);

function boot(){ LAST_HASH = curHash(); renderNow(); loadCosts().catch(() => {}); route(LAST_HASH, true).catch(() => {}); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
</body>
